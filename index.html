<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabana de Archavon</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #f4c430;
        --dark: #1a0f08;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Cinzel', serif;
        color: #fff;
        background: #000;
        overflow-x: hidden;
        min-height: 100vh;
        position: relative;
    }

    /* Fundo Galáxia */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: 
            radial-gradient(circle at 20% 30%, rgba(180,100,255,0.25), transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(100,200,255,0.25), transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 60%),
            #0a001f;
        background-size: 200% 200%;
        animation: galaxy 40s infinite linear;
        z-index: -3;
    }

    @keyframes galaxy {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        max-width: 580px;
        margin: 15px auto;
        padding: 15px;
        position: relative;
        z-index: 1;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo img {
        width: 180px;
        height: auto;
        filter: drop-shadow(0 0 20px #f4c430);
        margin-bottom: 10px;
    }

    .header h1 {
        font-family: 'UnifrakturCook', cursive;
        font-size: 46px;
        color: var(--gold);
        text-shadow: 0 0 20px #f4c430, 0 0 40px #8b0000;
        margin: 10px 0;
        letter-spacing: 4px;
    }

    .panel {
        background: linear-gradient(#1c0f08, #2c1a12);
        border: 5px solid #4a2c0b;
        border-image: linear-gradient(#f4c430, #8b5a2b) 1;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 0 40px rgba(244, 196, 48, 0.5);
    }

    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.8);
        border: 2px solid #663300;
        border-radius: 10px;
        padding: 14px 16px;
        margin: 12px 0;
        font-size: 18px;
    }

    .item-name {
        flex: 1;
        color: #e6d5b8;
    }

    .quantity {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #0f0a05;
        border: 2px solid #8b5a2b;
        border-radius: 8px;
        padding: 4px 8px;
    }

    .quantity button {
        background: #3a1f0f;
        color: #f4c430;
        border: none;
        width: 42px;
        height: 42px;
        font-size: 24px;
        border-radius: 6px;
        cursor: pointer;
    }

    .quantity input {
        width: 65px;
        text-align: center;
        background: #0f0a05;
        color: white;
        border: 2px solid #8b5a2b;
        font-size: 20px;
        padding: 6px;
        border-radius: 6px;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] {
        -moz-appearance: textfield;
    }

    .total {
        text-align: center;
        font-size: 28px;
        color: var(--gold);
        margin: 25px 0;
        text-shadow: 0 0 15px #f4c430;
    }

    button.main {
        width: 100%;
        margin: 10px 0;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    button.salvar   { background: linear-gradient(#2e8b57, #1e5c3a); }
    button.limpar   { background: linear-gradient(#555, #333); }
    button.fim      { background: linear-gradient(#8b1f1f, #5c0f0f); }

    button:hover { filter: brightness(1.2); transform: translateY(-2px); }

    #historico {
        margin-top: 30px;
        max-height: 320px;
        overflow-y: auto;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <img src="logo.png" alt="Cabana de Archavon">
        </div>
        <h1>Cabana de Archavon</h1>
    </div>

    <div class="panel">
        <div id="items"></div>

        <div class="total">
            Total a Cobrar: <strong id="total">0</strong>
        </div>

        <button class="main salvar" onclick="salvarVenda()">Salvar Venda</button>
        <button class="main limpar" onclick="limpar()">Limpar</button>
        <button class="main fim" onclick="fimExpediente()">Fim de Expediente</button>

        <div id="historico"></div>
    </div>
</div>

<script>
// ==================== PRODUTOS ====================
const itens = [
    { nome: "Cálice de Sangue", preco: 120 },
    { nome: "Vinho da Penumbra", preco: 120 },
    { nome: "Sangria Paranox", preco: 120 },
    { nome: "Ensopado Fortificante", preco: 120 },
    { nome: "Bife ao Vinho", preco: 120 },
    { nome: "Talharim de Carne", preco: 120 },
    { nome: "Elixir dos Sonhos", preco: 500 },
    { nome: "Elixir da Limpeza", preco: 500 }
];
// ===============================================

let vendas = JSON.parse(sessionStorage.getItem("vendasCabanaArchavon")) || [];

const container = document.getElementById("items");

itens.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
        <span class="item-name">${item.nome} (${item.preco})</span>
        <div class="quantity">
            <button onclick="menos(${i})">–</button>
            <input type="number" id="q${i}" value="0" min="0" oninput="calcular()">
            <button onclick="mais(${i})">+</button>
        </div>
    `;
    container.appendChild(div);
});

function mais(i) {
    let el = document.getElementById("q" + i);
    let valor = parseInt(el.value) || 0;
    el.value = valor + 1;
    calcular();
}

function menos(i) {
    let el = document.getElementById("q" + i);
    let valor = parseInt(el.value) || 0;
    if (valor > 0) el.value = valor - 1;
    calcular();
}

function calcular() {
    let total = 0;
    itens.forEach((item, i) => {
        let q = parseInt(document.getElementById("q" + i).value) || 0;
        total += q * item.preco;
    });
    document.getElementById("total").innerText = total;
    return total;
}

function salvarVenda() {
    let total = calcular();
    if (total <= 0) {
        alert("Adicione pelo menos um item antes de salvar.");
        return;
    }

    let venda = {
        data: new Date().toLocaleString("pt-BR"),
        total: total,
        itens: itens.map((item, i) => ({
            nome: item.nome,
            quantidade: parseInt(document.getElementById("q" + i).value) || 0
        })).filter(item => item.quantidade > 0)
    };

    vendas.push(venda);
    sessionStorage.setItem("vendasCabanaArchavon", JSON.stringify(vendas));

    alert(`✅ Venda de R$ ${total} salva com sucesso!`);
    atualizarHistorico();
}

function limpar() {
    itens.forEach((_, i) => {
        document.getElementById("q" + i).value = "0";
    });
    document.getElementById("total").innerText = "0";
}

function atualizarHistorico() {
    const hist = document.getElementById("historico");
    hist.innerHTML = `<h3 style="color:#f4c430; text-align:center; margin-bottom:15px;">Histórico de Vendas</h3>`;
    
    if (vendas.length === 0) return;

    vendas.forEach((venda) => {
        let html = `
            <div style="background:rgba(0,0,0,0.6); border:1px solid #663300; border-radius:8px; padding:12px; margin:10px 0;">
                <strong>${venda.data}</strong> — R$ ${venda.total}<br>
                <small style="color:#e6d5b8;">`;
        
        venda.itens.forEach(it => {
            html += `${it.quantidade}x ${it.nome}<br>`;
        });
        
        html += `</small></div>`;
        hist.innerHTML += html;
    });
}

function fimExpediente() {
    if (vendas.length === 0) {
        alert("Nenhuma venda registrada ainda.");
        return;
    }

    let totalGeral = vendas.reduce((acc, v) => acc + v.total, 0);
    let repasse = totalGeral * 0.20;

    let canvas = document.createElement("canvas");
    canvas.width = 850;
    canvas.height = 650;
    let ctx = canvas.getContext("2d");

    ctx.fillStyle = "#f5e8c7";
    ctx.fillRect(0, 0, 850, 650);

    ctx.strokeStyle = "#8b5a2b";
    ctx.lineWidth = 25;
    ctx.strokeRect(30, 30, 790, 590);

    ctx.fillStyle = "#4a2c0b";
    ctx.font = "bold 52px UnifrakturCook";
    ctx.textAlign = "center";
    ctx.fillText("Cabana de Archavon", 425, 110);

    ctx.font = "28px Cinzel";
    ctx.fillText("Relatório de Expediente", 425, 160);

    ctx.font = "bold 32px Cinzel";
    ctx.fillText(`Total Vendido: R$ ${totalGeral}`, 425, 260);
    ctx.fillText(`Repasse (20%): R$ ${repasse.toFixed(2)}`, 425, 320);

    ctx.font = "24px Cinzel";
    ctx.fillText(`Data: ${new Date().toLocaleDateString("pt-BR")}`, 425, 400);

    ctx.font = "20px Cinzel";
    ctx.fillText("Obrigado por trabalhar na Cabana!", 425, 580);

    let link = document.createElement("a");
    link.download = "comprovante-cabana-archavon.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

    alert("Comprovante gerado com sucesso!");

    sessionStorage.removeItem("vendasCabanaArchavon");
    vendas = [];
    atualizarHistorico();
    limpar();
}

// Inicializa
atualizarHistorico();
</script>
</body>
</html>
