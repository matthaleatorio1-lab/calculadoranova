<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabana de Archavon</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #f4c430;
        --dark: #1a0f08;
        --red: #8b0000;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Cinzel', serif;
        color: #fff;
        background: #000;
        overflow-x: hidden;
        min-height: 100vh;
        position: relative;
    }

    /* Fundo de Galáxia */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: 
            radial-gradient(circle at 20% 30%, rgba(180, 100, 255, 0.25), transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(100, 200, 255, 0.25), transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08), transparent 60%),
            #0a001f;
        background-size: 200% 200%;
        animation: galaxy 35s infinite linear;
        z-index: -3;
    }

    @keyframes galaxy {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Efeito de fogo sutil */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        box-shadow: 
            0 0 100px 40px rgba(255, 60, 0, 0.25) inset,
            0 0 160px 80px rgba(255, 140, 0, 0.15) inset;
        pointer-events: none;
        z-index: -2;
        opacity: 0.6;
    }

    .container {
        max-width: 560px;
        margin: 20px auto;
        padding: 15px;
        position: relative;
        z-index: 1;
    }

    /* Cabeçalho com dragões */
    .header {
        text-align: center;
        position: relative;
        margin-bottom: 25px;
    }

    .header h1 {
        font-family: 'UnifrakturCook', cursive;
        font-size: 42px;
        color: var(--gold);
        text-shadow: 
            0 0 15px #f4c430,
            0 0 30px #8b0000,
            3px 3px 0 #000,
            -3px -3px 0 #000;
        margin: 15px 0 5px;
        letter-spacing: 3px;
    }

    .dragons {
        position: relative;
        height: 140px;
        margin-bottom: -40px;
    }

    .dragons::before,
    .dragons::after {
        content: "🐉";
        font-size: 110px;
        position: absolute;
        top: -20px;
        filter: drop-shadow(0 0 20px #f4c430);
        opacity: 0.9;
    }

    .dragons::before { left: 15%; transform: scaleX(-1); }
    .dragons::after { right: 15%; }

    /* Painel principal */
    .panel {
        background: linear-gradient(#1c0f08, #2c1a12);
        border: 4px solid #4a2c0b;
        border-image: linear-gradient(#f4c430, #8b5a2b) 1;
        border-radius: 12px;
        padding: 20px 15px;
        box-shadow: 
            0 0 30px rgba(244, 196, 48, 0.4),
            inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* Itens */
    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.75);
        border: 2px solid #4a2c0b;
        border-radius: 8px;
        padding: 12px 15px;
        margin: 10px 0;
        font-size: 17px;
    }

    .item span {
        color: #e6d5b8;
    }

    .controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .controls button {
        background: #3a1f0f;
        color: #f4c430;
        border: 2px solid #8b5a2b;
        width: 36px;
        height: 36px;
        font-size: 20px;
        cursor: pointer;
        border-radius: 6px;
    }

    .controls input {
        width: 70px;
        text-align: center;
        background: #0f0a05;
        color: white;
        border: 2px solid #8b5a2b;
        font-size: 18px;
        padding: 6px;
        border-radius: 6px;
    }

    /* Total */
    .total {
        text-align: center;
        font-size: 24px;
        color: var(--gold);
        margin: 20px 0;
        text-shadow: 0 0 10px #f4c430;
    }

    /* Botões */
    button.main {
        width: 100%;
        margin: 8px 0;
        padding: 14px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    button.calcular {
        background: linear-gradient(#6b4e9e, #4a2c8b);
        color: white;
    }

    button.limpar {
        background: linear-gradient(#555, #333);
        color: white;
    }

    button.fim {
        background: linear-gradient(#8b1f1f, #5c0f0f);
        color: white;
    }

    button:hover {
        filter: brightness(1.15);
        transform: translateY(-2px);
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="dragons"></div>
        <h1>Cabana de Archavon</h1>
    </div>

    <div class="panel" id="panel">
        <div id="items"></div>

        <div class="total">
            Total a Cobrar: <strong id="total">0</strong>
        </div>

        <button class="main calcular" onclick="calcular()">Calcular</button>
        <button class="main limpar" onclick="limpar()">Limpar</button>
        <button class="main fim" onclick="fimExpediente()">Fim de Expediente</button>
    </div>
</div>

<script>
// Produtos
const itens = [
    { nome: "Elixir da Saciedade", preco: 90 },
    { nome: "Ensopado Fortificante", preco: 90 },
    { nome: "Elixir dos Sonhos", preco: 500 },
    { nome: "Elixir de Limpeza", preco: 500 }
];

const container = document.getElementById("items");

itens.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
        <span>${item.nome} (${item.preco})</span>
        <div class="controls">
            <button onclick="menos(${i})">–</button>
            <input type="number" id="q${i}" value="0" min="0">
            <button onclick="mais(${i})">+</button>
        </div>
    `;
    container.appendChild(div);
});

function mais(i) {
    let el = document.getElementById("q" + i);
    el.value = parseInt(el.value || 0) + 1;
}

function menos(i) {
    let el = document.getElementById("q" + i);
    el.value = Math.max(0, parseInt(el.value || 0) - 1);
}

function calcular() {
    let total = 0;
    itens.forEach((item, i) => {
        let q = parseInt(document.getElementById("q" + i).value) || 0;
        total += q * item.preco;
    });
    document.getElementById("total").innerText = total;
    return total;
}

function limpar() {
    itens.forEach((_, i) => {
        document.getElementById("q" + i).value = 0;
    });
    document.getElementById("total").innerText = 0;
}

function fimExpediente() {
    let total = calcular();
    if (total === 0) {
        alert("Nenhuma venda registrada.");
        return;
    }

    let repasse = total * 0.20;
    let data = new Date().toLocaleDateString("pt-BR");

    let canvas = document.createElement("canvas");
    canvas.width = 800;
    canvas.height = 500;
    let ctx = canvas.getContext("2d");

    ctx.fillStyle = "#0a001f";
    ctx.fillRect(0, 0, 800, 500);

    // Título
    ctx.fillStyle = "#f4c430";
    ctx.font = "bold 48px UnifrakturCook";
    ctx.textAlign = "center";
    ctx.fillText("Cabana de Archavon", 400, 100);

    // Total
    ctx.fillStyle = "#fff";
    ctx.font = "28px Cinzel";
    ctx.fillText(`Total Vendido: R$ ${total}`, 400, 220);

    ctx.fillText(`Repasse (20%): R$ ${repasse.toFixed(2)}`, 400, 280);

    ctx.font = "22px Cinzel";
    ctx.fillText(`Expediente: ${data}`, 400, 380);

    // Download
    let link = document.createElement("a");
    link.download = "expediente-cabana-archavon.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

    alert("Expediente finalizado e imagem gerada!");
    limpar();
}
</script>
</body>
</html>
